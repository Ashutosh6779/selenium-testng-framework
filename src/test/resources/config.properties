# Framework Configuration
# Overrideable via system properties in CI: -Dbrowser=firefox -Dheadless=true

# Browser: chrome | firefox | edge
browser=chrome

# Application under test
base.url=https://www.saucedemo.com

# Environment label shown in Allure report
environment=QA

# Timeouts (seconds)
implicit.wait=5
explicit.wait=15

# Set to true in CI/CD pipelines (headless = no GUI, runs faster)
headless=false
